<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beyonex Admin</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <script>
      (function () {
        try {
          var theme = localStorage.getItem('beyonex-dashboard-theme');
          if (theme !== 'light' && theme !== 'dark') theme = 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}

        var base = '%VITE_API_BASE_URL%' || 'https://backend.beyonexit.com/api/';
        var origin = base.replace(/\/api\/?$/, '');

        function resolveFaviconUrl(value) {
          if (!value || typeof value !== 'string') return null;
          var trimmed = value.trim();
          if (!trimmed) return null;
          var dataIndex = trimmed.indexOf('data:');
          if (dataIndex !== -1) return trimmed.slice(dataIndex);
          if (/^https?:\/\//i.test(trimmed)) return trimmed;
          return trimmed.startsWith('/')
            ? origin + trimmed
            : origin + '/' + trimmed;
        }

        fetch(base + 'settings', { headers: { Accept: 'application/json' } })
          .then(function (res) { return res.ok ? res.json() : null; })
          .then(function (json) {
            var url = resolveFaviconUrl(json && json.data && json.data.favicon);
            if (!url) return;
            document
              .querySelectorAll('link[rel="icon"], link[rel="alternate icon"], link[rel="shortcut icon"]')
              .forEach(function (link) { link.remove(); });
            var link = document.createElement('link');
            link.rel = 'icon';
            link.type = url.endsWith('.svg') ? 'image/svg+xml' : 'image/png';
            link.href = url;
            document.head.appendChild(link);
          })
          .catch(function () {});
      })();
    </script>

    <style>
      #app-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background:
          radial-gradient(ellipse 70% 55% at 50% 42%, rgba(33, 128, 166, 0.18), transparent 70%),
          #0d1a26;
        color: #eaf3f8;
        font-family: Montserrat, sans-serif;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }

      #app-shell .shell-mark {
        position: relative;
        width: 78px;
        height: 78px;
        display: grid;
        place-items: center;
      }

      #app-shell .shell-ring,
      #app-shell .shell-ringDelay {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1.5px solid transparent;
        border-top-color: #32c8d9;
        border-right-color: rgba(50, 200, 217, 0.35);
        animation: shellSpin 1.1s cubic-bezier(0.55, 0.1, 0.25, 1) infinite;
      }

      #app-shell .shell-ringDelay {
        inset: 8px;
        border-top-color: rgba(125, 217, 230, 0.85);
        border-right-color: transparent;
        border-bottom-color: rgba(50, 200, 217, 0.25);
        animation-duration: 1.55s;
        animation-direction: reverse;
      }

      #app-shell .shell-core {
        position: relative;
        z-index: 1;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, #143049 0%, #0d1a26 100%);
        border: 1px solid rgba(50, 200, 217, 0.28);
        box-shadow:
          0 0 0 4px rgba(50, 200, 217, 0.06),
          0 10px 28px rgba(0, 0, 0, 0.28);
        animation: shellCorePulse 2s ease-in-out infinite;
      }

      #app-shell .shell-coreLetter {
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #fff 0%, #7dd9e6 45%, #32c8d9 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1;
      }

      #app-shell .shell-loader {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.85rem;
        width: min(220px, 72vw);
      }

      #app-shell .shell-loaderTrack {
        position: relative;
        width: 100%;
        height: 2px;
        border-radius: 999px;
        background: rgba(50, 200, 217, 0.14);
        overflow: hidden;
      }

      #app-shell .shell-loaderBar {
        position: absolute;
        inset-block: 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, #2180a6, #32c8d9, #7dd9e6);
        box-shadow: 0 0 16px rgba(50, 200, 217, 0.55);
        animation: shellProgress 1.15s cubic-bezier(0.45, 0.05, 0.25, 1) infinite;
      }

      #app-shell .shell-loaderDots {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
      }

      #app-shell .shell-loaderDots span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(50, 200, 217, 0.35);
        animation: shellDot 1.2s ease-in-out infinite;
      }

      #app-shell .shell-loaderDots span:nth-child(2) {
        animation-delay: 0.15s;
      }

      #app-shell .shell-loaderDots span:nth-child(3) {
        animation-delay: 0.3s;
      }

      #app-shell.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      @keyframes shellSpin {
        to { transform: rotate(360deg); }
      }

      @keyframes shellCorePulse {
        0%, 100% {
          box-shadow:
            0 0 0 4px rgba(50, 200, 217, 0.06),
            0 10px 28px rgba(0, 0, 0, 0.28);
        }
        50% {
          box-shadow:
            0 0 0 6px rgba(50, 200, 217, 0.12),
            0 12px 32px rgba(50, 200, 217, 0.12);
        }
      }

      @keyframes shellProgress {
        0% { inset-inline-start: -45%; }
        100% { inset-inline-start: 103%; }
      }

      @keyframes shellDot {
        0%, 80%, 100% {
          transform: scale(0.75);
          opacity: 0.35;
        }
        40% {
          transform: scale(1);
          opacity: 1;
          background: #32c8d9;
          box-shadow: 0 0 10px rgba(50, 200, 217, 0.45);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-shell .shell-ring,
        #app-shell .shell-ringDelay,
        #app-shell .shell-core,
        #app-shell .shell-loaderBar,
        #app-shell .shell-loaderDots span {
          animation: none;
        }
        #app-shell .shell-loaderBar {
          inset-inline-start: 29%;
          width: 42%;
        }
        #app-shell .shell-loaderDots span {
          opacity: 0.7;
          background: #32c8d9;
        }
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app-shell" aria-hidden="true">
      <div class="shell-mark" aria-hidden="true">
        <span class="shell-ring"></span>
        <span class="shell-ringDelay"></span>
        <span class="shell-core"><span class="shell-coreLetter">B</span></span>
      </div>
      <div class="shell-loader" role="status" aria-label="Loading">
        <div class="shell-loaderTrack">
          <span class="shell-loaderBar"></span>
        </div>
        <div class="shell-loaderDots" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
