<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beyonex Admin</title>

    <style>
      #app-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.35rem;
        background:
          radial-gradient(circle at 18% 18%, rgba(50, 200, 217, 0.08), transparent 42%),
          radial-gradient(circle at 82% 82%, rgba(33, 128, 166, 0.1), transparent 40%),
          #0d1a26;
        color: #eaf3f8;
        font-family: Montserrat, sans-serif;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #app-shell::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(50, 200, 217, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(50, 200, 217, 0.04) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: radial-gradient(circle at center, black, transparent 78%);
        pointer-events: none;
      }
      #app-shell .shell-brand {
        position: relative;
        z-index: 1;
        margin: 0;
        font-size: clamp(1.65rem, 6vw, 2.5rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        text-align: center;
        padding: 0 1rem;
        background: linear-gradient(135deg, #fff 0%, #7dd9e6 45%, #32c8d9 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      #app-shell .shell-spinner {
        position: relative;
        z-index: 1;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 2px solid rgba(50, 200, 217, 0.18);
        border-top-color: #32c8d9;
        animation: shellSpin 0.8s linear infinite;
      }
      #app-shell.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      @keyframes shellSpin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- Fonts: only weights used by the dashboard -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app-shell" aria-hidden="true">
      <h1 class="shell-brand">Beyonex Admin</h1>
      <div class="shell-spinner" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
